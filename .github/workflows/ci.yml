# Runs on every pull request and on main. Both jobs should be required checks on main
# (Settings → Branches → branch protection), so a broken build cannot be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build refuses to ship a script that does not parse.
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:services
      - run: npm run test:unit
      # The build regenerates vercel.json; a difference means a build change was not committed.
      - name: Build leaves the repository unchanged
        run: git status --porcelain && test -z "$(git status --porcelain)"

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke

  guided-dive:
    name: Guided dive experience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:guided:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-dive-captures
          path: ocean-refined/qa/captures/*-qa.*

  # Phone, landscape and desktop layout (tools/test-mobile-layout.mjs). Software WebGL makes it the slowest job; keep it
  # out of the required checks until it has proved steady on GitHub's runners.
  layout:
    name: Mobile layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:layout
        env:
          LAYOUT_OUT: layout-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: layout-report
