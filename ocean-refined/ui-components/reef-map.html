<!-- Round minimap (data-view="round") and the expanded reef atlas (data-view="full")
     Source: index.html; markers and legend are added by world.js
     Styles: styles.css, hologram.css, hud.css (+ motion.css for transitions), journey.css (found markers, progress line)
     Scripts: hud.js (pans and turns #map-chart under the centre arrow, rim pips, expand / collapse); expedition-ui.js drawReefChart (the canvas); world.js (marker and diver positions, readings); journey.js (found state); motion.js (selected state)
     Shipped hidden: world.js shows it underwater. The round view shows 50 m around the diver; sites beyond the rim get data-off="true". -->
<aside class="reef-map" aria-label="Reef exploration map" data-view="round" hidden>
  <div class="map-heading"><span>REEF ATLAS</span><button id="reset-view" type="button" aria-label="Return to the starting view">Reset view</button><button id="map-toggle" type="button" aria-label="Expand reef atlas" aria-expanded="false" aria-controls="map-chart map-legend" hidden>＋</button></div>
  <div class="map-lens">
    <div class="map-chart" id="map-chart">
      <canvas id="reef-bathymetry" class="map-terrain" aria-label="Depth contours sampled from the reef terrain"></canvas>
      <span class="map-orientation" aria-hidden="true">N ← · E ↑</span><span class="map-player" id="map-player" aria-hidden="true" style="left: 50%; top: 75%;"></span>
      <button type="button" aria-label="Map marker About" title="About" data-landmark="about" style="left: 40.3226%; top: 64.2857%;">1</button><button type="button" aria-label="Map marker Experience" title="Experience" data-landmark="experience" style="left: 35.4839%; top: 16.4286%;">2</button><button type="button" aria-label="Map marker Projects" title="Projects" data-landmark="projects" style="left: 64.5161%; top: 47.1429%;">3</button>
    </div>
    <i class="map-sweep" aria-hidden="true"></i><i class="map-rose" aria-hidden="true"><b>N</b></i><span class="map-range" aria-hidden="true">50 m</span>
  </div>
  <i class="map-lubber" aria-hidden="true"></i>
  <button id="map-expand" class="map-expand" type="button" aria-expanded="false" aria-controls="map-legend" aria-label="Expand reef map"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="map-expand-out" d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/><path class="map-expand-in" d="M20 10h-6V4M4 14h6v6M14 10l6-6M10 14l-6 6"/></svg></button>
  <div class="map-legend" id="map-legend"><button type="button" aria-label="Swim to About"><span>01</span>About</button><button type="button" aria-label="Swim to Experience"><span>02</span>Experience</button><button type="button" aria-label="Swim to Projects"><span>03</span>Projects</button></div>
  <div class="chart-key">SHALLOW ▰ ▰ ▰ DEEP · 5 M CONTOURS</div><div class="map-reading"><span id="reef-zone">REEF SHELF</span><span id="speed-value">0.0 M/S</span></div>
  <p id="map-caption">Choose a marker to swim closer.</p>
</aside>
