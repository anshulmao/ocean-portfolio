<!-- Guided dive sheet
     Source: guided-dive.js (built at load and appended to <body>)
     Styles: hologram.css (slate recipe), motion.css, journey.css (layout, buttons)
     Scripts: guided-dive.js, journey.js
     guided-dive.js fills the kicker, title and caption, hides the buttons that do not apply and sets data-show / data-state
     and data-sheet (collapsed: the row and one action; expanded: everything). It mirrors data-sheet on <body>. -->
<section class="tour-card holo holo--reading" aria-label="Guided dive" data-show="false" data-sheet="collapsed" inert><div class="tour-progress" aria-hidden="true"><i></i></div><button type="button" class="tour-head" data-tour="toggle" aria-expanded="false"><span class="holo-label tour-kicker"></span><span class="holo-value tour-count"></span><i class="tour-chevron" aria-hidden="true"></i></button><h2 class="tour-title"></h2><div class="tour-body"><p class="tour-lines" aria-live="polite"></p><button type="button" class="tour-more" data-tour="more" aria-expanded="false"><span>More</span></button></div><p class="tour-pace"></p><footer><button type="button" data-tour="pause">Pause <kbd>P</kbd></button><button type="button" data-tour="read">Read it <kbd>F</kbd></button><button type="button" data-tour="next">Next <kbd>N</kbd></button><button type="button" data-tour="rejoin">Rejoin <kbd>G</kbd></button><button type="button" data-tour="surface">Surface</button><button type="button" data-tour="explore">Keep exploring</button><button type="button" data-tour="exit">Exit tour</button></footer></section>
<div class="tour-fade" aria-hidden="true"></div>
