<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg"><title>Ocean world studio</title><meta name="theme-color" content="#b9dfea"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./dive-hud.css"><link rel="stylesheet" href="./ocean-ui.css"><style>body.viewer>*:not(#world):not(.viewer-panel){display:none!important}.viewer-panel{position:fixed;top:20px;left:20px;z-index:50;width:280px;max-height:calc(100dvh - 40px);overflow:auto;background:#f0fbfff0;color:#184458;backdrop-filter:blur(12px);padding:20px;border-radius:15px;box-shadow:0 12px 40px #00213950;font:12px Outfit,system-ui}.viewer-panel button,.viewer-panel select,.viewer-panel input,.viewer-panel a{font:inherit;color:inherit;padding:8px;border:1px solid #a4cdd7;border-radius:7px;background:white;margin:4px 0;text-decoration:none}.viewer-panel button{cursor:pointer}.viewer-panel label{display:block;margin-top:9px}.viewer-panel input[type=range]{width:100%;padding:0}.viewer-panel input[type=number]{width:68px}.viewer-panel a{display:inline-block}.viewer-panel small{display:block;line-height:1.6;opacity:.7}.viewer-panel h1{font-size:22px;margin:0 0 8px}.viewer-panel h2{font-size:14px;margin:15px 0 4px}.viewer-panel .row{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:600px){.viewer-panel{width:190px;padding:12px;font-size:11px;max-height:42vh;top:10px;left:10px}}</style></head><body><script type="module" src="./world-viewer.js"></script></body></html>
