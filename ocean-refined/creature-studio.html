<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg"><title>Creature studio</title><meta name="theme-color" content="#0c4a5e">
<style>
@font-face{font-family:Outfit;src:url(./assets/fonts/outfit-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Outfit;src:url(./assets/fonts/outfit-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--ink:#e9f7f8;--dim:#9cc3c9;--line:#ffffff24;--panel:#06283aee;--accent:#7fe3d4;--bg:#0b4254}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Outfit,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
aside{position:fixed;top:16px;left:16px;bottom:16px;width:292px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);overflow:hidden}
header{padding:16px 16px 10px}
h1{font-size:19px;font-weight:500;margin:0 0 2px;letter-spacing:.01em}
header p{margin:0;color:var(--dim);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
button,a.button{font:inherit;color:inherit;background:#ffffff10;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;text-align:center}
button:hover,a.button:hover{background:#ffffff1c}
button[aria-pressed=true]{background:var(--accent);color:#04303a;border-color:transparent}
button:focus-visible,a:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1;min-height:0}
li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 8px;border-radius:8px;cursor:pointer}
li.heading{display:block;cursor:default;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 8px 4px}
li[data-id]:hover{background:#ffffff10}
li[aria-selected=true]{background:#7fe3d426;box-shadow:inset 2px 0 var(--accent)}
li b{font-weight:500}
li i{grid-column:1;color:var(--dim);font-size:11.5px}
li span{grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;color:var(--dim)}
section{padding:12px 16px 14px;border-top:1px solid var(--line)}
section h2{font-size:15px;font-weight:500;margin:0}
section em{display:block;color:var(--dim);font-size:12px;margin-bottom:6px}
section p{margin:0 0 9px;color:#cfe6e8;font-size:12.5px}
.facts{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;margin-bottom:9px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.row label{display:flex;align-items:center;gap:6px;color:var(--dim)}
input[type=range]{accent-color:var(--accent);width:96px}
#labels{position:fixed;inset:0;pointer-events:none}
#labels div{position:absolute;transform:translate(-50%,0);text-align:center;font-size:11.5px;white-space:nowrap;text-shadow:0 1px 3px #0009}
#labels div small{display:block;color:var(--dim);font-size:10.5px}
#hint{position:fixed;right:16px;bottom:14px;color:var(--dim);font-size:11.5px}
body.bare aside,body.bare #hint{display:none}
@media(max-width:720px){aside{width:auto;right:16px;top:auto;height:56vh}ul{min-height:96px}#hint{display:none}}
</style></head><body>
<canvas id="view"></canvas><div id="labels"></div>
<aside>
  <header><h1>Creature studio</h1><p>Rigged low-poly animals and coral · site scale, 1 unit = 1 m</p></header>
  <div class="tabs"><button id="tab-model" aria-pressed="true">One model</button><button id="tab-lineup" aria-pressed="false">Size line-up</button><button id="tab-creatures" aria-pressed="false">Animal sheet</button><button id="tab-corals" aria-pressed="false">Coral sheet</button></div>
  <ul id="list" role="listbox" aria-label="Models"></ul>
  <section>
    <h2 id="name"></h2><em id="latin"></em><p id="note"></p><div class="facts" id="facts"></div>
    <div class="row" id="clips"></div>
    <div class="row"><button id="play" aria-pressed="true">Playing</button><button id="bones" aria-pressed="false">Skeleton</button><label>Speed <input id="speed" type="range" min="0" max="2" step=".05" value="1"></label></div>
    <div class="row"><button id="download">Download GLB</button><button id="all">Download whole set</button></div>
  </section>
</aside>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<script type="module" src="./creature-studio.js"></script>
</body></html>
